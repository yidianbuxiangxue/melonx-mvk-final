name: MeloNX MVK Test empty-repository bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melonx-mvk-empty-repo-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ARCHIVE_URL: https://git.ryujinx.app/projects/MeloNX/archive/2.5.zip
  SOURCE_ARCHIVE_SHA256: E0729710487EFD17DBAB97104D9979B94692A99E39AD33B90830AAF4B66B0FD5
  MVK_PACKAGE_ID: Ryujinx.Graphics.Vulkan.MoltenVK
  MVK_PACKAGE_VERSION: 1.4.2-ryujinx.6
  MVK_NUPKG_SHA256: 94c45b29a72ddf33e2aa5a2735fceff3327bb79d9436ce921fab127a4d56f775
  MVK_IOS_SOURCE_SHA256: 0cc616e251400f1eecda64d9833601111db6eebd6c137fc2c568c4a03aac688c
  OLD_MVK_140_SHA256: 5735ca4aee60ed7e0475b80b8ecdcfc952e4e0b7d49018f11781e51e5106bfa5
  TEST_BUNDLE_ID: com.melonx.mvk142test
  TEST_DISPLAY_NAME: MeloNX MVK Test
  TEST_VARIANT: MVK Test A
  IOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  build:
    name: Bootstrap official 2.5 and build iOS arm64 IPA
    runs-on: macos-26-intel
    timeout-minutes: 120

    steps:
      - name: Initialize temporary paths and failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/mxartifacts"
          source_archive="$RUNNER_TEMP/MeloNX-2.5-source.zip"
          source_extract_root="$RUNNER_TEMP/melonx-src"
          derived_data_path="$RUNNER_TEMP/mxdd"
          stage_path="$RUNNER_TEMP/mxstage"
          verify_path="$RUNNER_TEMP/mxverify"
          {
            echo "ARTIFACT_DIR=$artifact_dir"
            echo "SOURCE_ARCHIVE=$source_archive"
            echo "SOURCE_EXTRACT_ROOT=$source_extract_root"
            echo "DERIVED_DATA_PATH=$derived_data_path"
            echo "STAGE_PATH=$stage_path"
            echo "VERIFY_PATH=$verify_path"
          } >> "$GITHUB_ENV"

          rm -rf \
            "$artifact_dir" \
            "$source_archive" \
            "$source_extract_root" \
            "$derived_data_path" \
            "$stage_path" \
            "$verify_path"
          mkdir -p \
            "$artifact_dir/final" \
            "$artifact_dir/failure" \
            "$stage_path" \
            "$verify_path"
          touch \
            "$artifact_dir/failure/xcodebuild.log" \
            "$artifact_dir/failure/environment.txt" \
            "$artifact_dir/failure/failure-summary.txt" \
            "$artifact_dir/failure/build-settings.txt" \
            "$artifact_dir/failure/dependency-report.txt"

      - name: Record runner and default Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Workflow repository: $GITHUB_REPOSITORY"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "Runner name: $RUNNER_NAME"
            echo "Runner architecture: $RUNNER_ARCH"
            sw_vers
            uname -m
            uname -a
            xcodebuild -version
            xcode-select -p
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-path
            echo "DerivedData: $DERIVED_DATA_PATH"
            echo "Source extraction root: $SOURCE_EXTRACT_ROOT"
          } 2>&1 | tee "$ARTIFACT_DIR/failure/environment.txt"

      - name: Download and verify official MeloNX 2.5 source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCE=official MeloNX 2.5 archive"
            echo "SOURCE_URL=$SOURCE_ARCHIVE_URL"
            echo "EXPECTED_SOURCE_SHA256=$SOURCE_ARCHIVE_SHA256"
            echo "Downloading only the previously verified official archive."
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --silent \
              --show-error \
              "$SOURCE_ARCHIVE_URL" \
              --output "$SOURCE_ARCHIVE"
            [[ -s "$SOURCE_ARCHIVE" ]]
            actual_source_sha="$(shasum -a 256 "$SOURCE_ARCHIVE" | awk '{print toupper($1)}')"
            echo "ACTUAL_SOURCE_SHA256=$actual_source_sha"
            [[ "$actual_source_sha" == "$SOURCE_ARCHIVE_SHA256" ]] || {
              echo "Official source archive SHA-256 mismatch." >&2
              exit 1
            }
            echo "Source archive verification: PASSED"
          } 2>&1 | tee -a "$ARTIFACT_DIR/failure/dependency-report.txt"

      - name: Safely extract archive and identify the project root
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 - "$SOURCE_ARCHIVE" "$SOURCE_EXTRACT_ROOT" <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import shutil
          import stat
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          extraction_root = Path(sys.argv[2])

          if extraction_root.exists():
              shutil.rmtree(extraction_root)
          extraction_root.mkdir(parents=True)

          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if not members:
                  raise SystemExit("SOURCE EXTRACT ERROR: archive is empty")
              for member in members:
                  path = PurePosixPath(member.filename)
                  unix_mode = member.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or (path.parts and ":" in path.parts[0])
                      or stat.S_ISLNK(unix_mode)
                  ):
                      raise SystemExit(
                          f"SOURCE EXTRACT ERROR: unsafe archive member: {member.filename}"
                      )
              source.extractall(extraction_root)

          roots = []
          for solution in extraction_root.rglob("Ryujinx.sln"):
              candidate = solution.parent.resolve()
              if (
                  (candidate / "src").is_dir()
                  and (candidate / "Directory.Packages.props").is_file()
              ):
                  roots.append(candidate)

          roots = sorted(set(roots))
          print("Project-root candidates:")
          for root in roots:
              print(f"  {root}")
          if len(roots) != 1:
              raise SystemExit(
                  f"SOURCE EXTRACT ERROR: expected exactly one project root, found {len(roots)}"
              )

          root = roots[0]
          extraction_root_resolved = extraction_root.resolve()
          if os.path.commonpath((root, extraction_root_resolved)) != str(
              extraction_root_resolved
          ):
              raise SystemExit("SOURCE EXTRACT ERROR: project root escaped RUNNER_TEMP")

          output = os.environ["GITHUB_ENV"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"SOURCE_ROOT={root}\n")
          print(f"Verified official source project root: {root}")
          PY
          } 2>&1 | tee -a "$ARTIFACT_DIR/failure/dependency-report.txt"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "===== dotnet environment and iOS workload ====="
            dotnet --info
            dotnet workload install ios --skip-manifest-update
            dotnet workload list
          } 2>&1 | tee -a "$ARTIFACT_DIR/failure/xcodebuild.log"

      - name: Idempotently apply and verify Version A in temporary source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python3 <<'PY' 2>&1 | tee -a "$ARTIFACT_DIR/failure/dependency-report.txt"
          from pathlib import Path
          import plistlib
          import sys

          def fail(message):
              print(f"SOURCE PATCH ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          props_path = Path("Directory.Packages.props")
          csproj_path = Path("src/Ryujinx.Library/Ryujinx.Library.csproj")
          entitlement_path = Path("src/MeloNX/MeloNX/MeloNX.entitlements")
          toolbar_path = Path(
              "src/MeloNX/MeloNX/UI/Main/GamesList/Elements/"
              "GamesListView+ToolBar.swift"
          )
          app_path = Path("src/MeloNX/MeloNX/UI/MeloNXApp.swift")

          paths = (
              props_path,
              csproj_path,
              entitlement_path,
              toolbar_path,
              app_path,
          )
          for path in paths:
              if not path.is_file():
                  fail(f"expected MeloNX 2.5 source file is missing: {path}")

          old_package_line = (
              '    <PackageVersion '
              'Include="Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK" '
              'Version="1.2.0" />'
          )
          new_package_line = (
              '    <PackageVersion '
              'Include="Ryujinx.Graphics.Vulkan.MoltenVK" '
              'Version="1.4.2-ryujinx.6" />'
          )
          props = props_path.read_text(encoding="utf-8")
          if props.count(old_package_line) != 1:
              fail("known MeloNX 2.5 package anchor is absent or ambiguous")
          if new_package_line not in props:
              props = props.replace(
                  old_package_line,
                  old_package_line + "\n" + new_package_line,
                  1,
              )
          if props.count(new_package_line) != 1:
              fail("pinned MoltenVK package entry is absent or ambiguous")
          props_path.write_text(props, encoding="utf-8")

          old_reference = (
              '    <PackageReference '
              'Include="Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK" '
              'Condition="\'$(RuntimeIdentifier)\' != \'linux-x64\' AND '
              '\'$(RuntimeIdentifier)\' != \'linux-arm64\' AND '
              '\'$(RuntimeIdentifier)\' != \'win-x64\'" />'
          )
          new_reference = (
              '    <PackageReference '
              'Include="Ryujinx.Graphics.Vulkan.MoltenVK" '
              'Condition="\'$(RuntimeIdentifier)\' == \'ios-arm64\'" />'
          )
          csproj = csproj_path.read_text(encoding="utf-8")
          if new_reference in csproj:
              if csproj.count(new_reference) != 1 or old_reference in csproj:
                  fail("Ryujinx.Library MoltenVK references are ambiguous")
          elif old_reference in csproj:
              if csproj.count(old_reference) != 1:
                  fail("old Ryujinx.Library MoltenVK reference is ambiguous")
              csproj = csproj.replace(old_reference, new_reference, 1)
          else:
              fail("known Ryujinx.Library MoltenVK reference was not found")
          if csproj.count(new_reference) != 1:
              fail("iOS arm64 MoltenVK package reference was not created")
          csproj_path.write_text(csproj, encoding="utf-8")

          try:
              with entitlement_path.open("rb") as stream:
                  entitlements = plistlib.load(stream)
          except Exception as exc:
              fail(f"cannot parse entitlements plist: {exc}")
          if not isinstance(entitlements, dict):
              fail("entitlements plist root is not a dictionary")
          required_entitlements = (
              "com.apple.developer.cs.allow-jit",
              "com.apple.developer.kernel.increased-memory-limit",
              "com.apple.developer.kernel.extended-virtual-addressing",
          )
          for key in required_entitlements:
              if key in entitlements and entitlements[key] is not True:
                  fail(f"required entitlement has non-true value: {key}")
              entitlements[key] = True
          with entitlement_path.open("wb") as stream:
              plistlib.dump(
                  entitlements,
                  stream,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False,
              )

          toolbar = toolbar_path.read_text(encoding="utf-8")
          modifier = ".sharedBackgroundVisibility(.hidden)"
          count = toolbar.count(modifier)
          if count == 2:
              lines = toolbar.splitlines(keepends=True)
              kept = [line for line in lines if line.strip() != modifier]
              if len(lines) - len(kept) != 2:
                  fail("toolbar modifiers are not standalone appearance lines")
              toolbar_path.write_text("".join(kept), encoding="utf-8")
          elif count != 0:
              fail(f"expected zero or two toolbar modifiers, found {count}")
          if modifier in toolbar_path.read_text(encoding="utf-8"):
              fail("sharedBackgroundVisibility remains after patch")

          app = app_path.read_text(encoding="utf-8")
          marker = "private func logMVKTestBuildDiagnostics()"
          imports_anchor = (
              "import SwiftUI\n"
              "import SDL3\n"
              "import AVFoundation\n"
          )
          diagnostic_block = r'''
          import SwiftUI
          import SDL3
          import AVFoundation
          import CryptoKit
          import Darwin

          private typealias VkEnumerateInstanceVersionFunction = @convention(c) (UnsafeMutablePointer<UInt32>?) -> Int32

          private func sha256(of path: String) -> String? {
              guard let data = try? Data(contentsOf: URL(fileURLWithPath: path), options: .mappedIfSafe) else {
                  return nil
              }

              return SHA256.hash(data: data).map { String(format: "%02x", $0) }.joined()
          }

          private func logMVKTestBuildDiagnostics() {
              let info = Bundle.main.infoDictionary ?? [:]

              guard let variant = info["MeloNXBuildVariant"] as? String, variant == "MVK Test A" else {
                  return
              }

              let displayVersion = info["CFBundleShortVersionString"] as? String ?? "unknown"
              let bundleID = Bundle.main.bundleIdentifier ?? "unknown"
              let commit = info["MeloNXGitCommit"] as? String ?? "unknown"
              let buildTimeVersion = info["MeloNXMoltenVKBuildVersion"] as? String ?? "unknown"
              let expectedHash = (info["MeloNXMoltenVKSHA256"] as? String)?.lowercased() ?? "unknown"

              print("[MeloNX MVK Test] app version: \(displayVersion)")
              print("[MeloNX MVK Test] bundle id: \(bundleID)")
              print("[MeloNX MVK Test] git commit: \(commit)")
              print("[MeloNX MVK Test] build variant: \(variant)")
              print("[MeloNX MVK Test] MoltenVK build-time package version: \(buildTimeVersion)")
              print("[MeloNX MVK Test] MoltenVK runtime version: unavailable from a reliable runtime version API")

              guard let handle = dlopen("libMoltenVK.dylib", RTLD_NOW | RTLD_LOCAL) else {
                  let loadError = dlerror().map { String(cString: $0) } ?? "unknown"
                  print("[MeloNX MVK Test] MoltenVK load failed: \(loadError)")
                  return
              }
              defer { dlclose(handle) }

              guard let symbol = dlsym(handle, "vkGetInstanceProcAddr") else {
                  print("[MeloNX MVK Test] vkGetInstanceProcAddr was not found")
                  return
              }

              var symbolInfo = Dl_info()
              if dladdr(symbol, &symbolInfo) != 0, let fileName = symbolInfo.dli_fname {
                  let loadedPath = String(cString: fileName)
                  let actualHash = sha256(of: loadedPath)?.lowercased() ?? "unavailable"
                  print("[MeloNX MVK Test] MoltenVK loaded path: \(loadedPath)")
                  print("[MeloNX MVK Test] MoltenVK loaded file SHA-256: \(actualHash)")
                  print("[MeloNX MVK Test] MoltenVK packaged hash match: \(actualHash == expectedHash)")
              }

              if let enumerateSymbol = dlsym(handle, "vkEnumerateInstanceVersion") {
                  let enumerateVersion = unsafeBitCast(enumerateSymbol, to: VkEnumerateInstanceVersionFunction.self)
                  var apiVersion: UInt32 = 0
                  if enumerateVersion(&apiVersion) == 0 {
                      let major = apiVersion >> 22
                      let minor = (apiVersion >> 12) & 0x3ff
                      let patch = apiVersion & 0xfff
                      print("[MeloNX MVK Test] Vulkan API version: \(major).\(minor).\(patch)")
                  }
              }
          }
          '''.lstrip()
          init_anchor = (
              "        Ryujinx.initialize()\n"
              "        ThemeManager.shared.applyUIKitAppearance()\n"
          )
          init_patched = (
              "        Ryujinx.initialize()\n"
              "        logMVKTestBuildDiagnostics()\n"
              "        ThemeManager.shared.applyUIKitAppearance()\n"
          )
          if marker not in app:
              if app.count(imports_anchor) != 1:
                  fail("MeloNXApp import anchor is absent or ambiguous")
              if app.count(init_anchor) != 1:
                  fail("MeloNXApp initialization anchor is absent or ambiguous")
              app = app.replace(imports_anchor, diagnostic_block, 1)
              app = app.replace(init_anchor, init_patched, 1)
              app_path.write_text(app, encoding="utf-8")
          else:
              if app.count(marker) != 1:
                  fail("MeloNXApp diagnostic function is ambiguous")
              if app.count("import CryptoKit") != 1 or app.count("import Darwin") != 1:
                  fail("MeloNXApp diagnostic imports are incomplete")
              if app.count("        logMVKTestBuildDiagnostics()\n") != 1:
                  fail("MeloNXApp diagnostic call is absent or ambiguous")

          final_app = app_path.read_text(encoding="utf-8")
          if (
              final_app.count(marker) != 1
              or final_app.count("        logMVKTestBuildDiagnostics()\n") != 1
          ):
              fail("MeloNXApp diagnostic patch verification failed")

          print("Applied and verified temporary Version A source changes:")
          for path in paths:
              print(f"  {path}")
          PY

          plutil -lint src/MeloNX/MeloNX/MeloNX.entitlements
          grep -F \
            'Ryujinx.Graphics.Vulkan.MoltenVK" Version="1.4.2-ryujinx.6"' \
            Directory.Packages.props
          grep -F \
            'Ryujinx.Graphics.Vulkan.MoltenVK" Condition="' \
            src/Ryujinx.Library/Ryujinx.Library.csproj
          ! grep -F '.sharedBackgroundVisibility(.hidden)' \
            src/MeloNX/MeloNX/UI/Main/GamesList/Elements/GamesListView+ToolBar.swift
          grep -F 'logMVKTestBuildDiagnostics()' \
            src/MeloNX/MeloNX/UI/MeloNXApp.swift

      - name: Download and verify MoltenVK iOS device library
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          package_id_lower="$(printf '%s' "$MVK_PACKAGE_ID" | tr '[:upper:]' '[:lower:]')"
          package_file="${package_id_lower}.${MVK_PACKAGE_VERSION}.nupkg"
          package_url="https://api.nuget.org/v3-flatcontainer/${package_id_lower}/${MVK_PACKAGE_VERSION}/${package_file}"
          nupkg="$STAGE_PATH/$package_file"
          mvk_source="$STAGE_PATH/libMoltenVK.dylib"

          {
            echo
            echo "===== MoltenVK dependency ====="
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              "$package_url" \
              --output "$nupkg"
            printf '%s  %s\n' "$MVK_NUPKG_SHA256" "$nupkg" | shasum -a 256 --check

            unzip -Z1 "$nupkg" > "$STAGE_PATH/nupkg-contents.txt"
            asset_count="$(grep -c '^runtimes/ios-arm64/native/libMoltenVK\.dylib$' "$STAGE_PATH/nupkg-contents.txt")"
            [[ "$asset_count" == "1" ]] || {
              echo "Expected one iOS arm64 MoltenVK asset; found $asset_count" >&2
              exit 1
            }
            unzip -j \
              "$nupkg" \
              'runtimes/ios-arm64/native/libMoltenVK.dylib' \
              -d "$STAGE_PATH"
            printf '%s  %s\n' "$MVK_IOS_SOURCE_SHA256" "$mvk_source" \
              | shasum -a 256 --check

            file "$mvk_source"
            [[ "$(lipo -archs "$mvk_source")" == "arm64" ]]
            vtool -show-build "$mvk_source" > "$STAGE_PATH/mvk-build.txt"
            cat "$STAGE_PATH/mvk-build.txt"
            grep -Eq \
              'platform[[:space:]]+IOS[[:space:]]*$|LC_VERSION_MIN_IPHONEOS' \
              "$STAGE_PATH/mvk-build.txt"
            ! grep -Eq \
              'platform[[:space:]]+(IOSSIMULATOR|MACOS|MACCATALYST)[[:space:]]*$|LC_VERSION_MIN_(IPHONESIMULATOR|MACOSX)' \
              "$STAGE_PATH/mvk-build.txt"

            mvk_minos="$(awk '$1 == "minos" { value=$2 } $1 == "version" && value == "" { value=$2 } END { print value }' "$STAGE_PATH/mvk-build.txt")"
            [[ -n "$mvk_minos" ]]
            python3 - "$mvk_minos" <<'PY'
          import sys
          value = tuple(int(part) for part in sys.argv[1].split("."))
          value += (0,) * (2 - len(value))
          if value > (15, 0):
              raise SystemExit(f"MoltenVK minimum OS {sys.argv[1]} exceeds 15.0")
          PY

            install_id="$(otool -D "$mvk_source" | sed -n '2p')"
            if [[ "$install_id" != '@rpath/libMoltenVK.dylib' ]]; then
              install_name_tool -id '@rpath/libMoltenVK.dylib' "$mvk_source"
            fi
            [[ "$(otool -D "$mvk_source" | sed -n '2p')" == '@rpath/libMoltenVK.dylib' ]]

            mvk_final_sha="$(shasum -a 256 "$mvk_source" | awk '{print $1}')"
            echo "MVK_FINAL_SHA256=$mvk_final_sha" >> "$GITHUB_ENV"
            target="src/MeloNX/MeloNX/Dependencies/libMoltenVK.dylib"
            [[ -f "$target" ]]
            cp "$mvk_source" "$target"
            [[ "$(shasum -a 256 "$target" | awk '{print $1}')" == "$mvk_final_sha" ]]

            echo "Package source: $package_url"
            echo "Package: $MVK_PACKAGE_ID $MVK_PACKAGE_VERSION"
            echo "NUPKG SHA-256: $MVK_NUPKG_SHA256"
            echo "Asset: runtimes/ios-arm64/native/libMoltenVK.dylib"
            echo "Source asset SHA-256: $MVK_IOS_SOURCE_SHA256"
            echo "Final embedded-file SHA-256: $mvk_final_sha"
            echo "Architecture: $(lipo -archs "$mvk_source")"
            echo "Minimum OS: $mvk_minos"
            echo "Install name: $(otool -D "$mvk_source" | sed -n '2p')"
            otool -L "$mvk_source"
            otool -l "$mvk_source"
          } 2>&1 | tee -a "$ARTIFACT_DIR/failure/dependency-report.txt"

      - name: Restore managed dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          {
            echo
            echo "===== dotnet restore ====="
            dotnet restore \
              src/Ryujinx.Library/Ryujinx.Library.csproj \
              --runtime ios-arm64
          } 2>&1 | tee -a "$ARTIFACT_DIR/failure/xcodebuild.log"

      - name: Capture release build settings
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            PRODUCT_BUNDLE_IDENTIFIER="$TEST_BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$TEST_DISPLAY_NAME" \
            INFOPLIST_KEY_MeloNXBuildVariant="$TEST_VARIANT" \
            INFOPLIST_KEY_MeloNXGitCommit="$GITHUB_SHA" \
            INFOPLIST_KEY_MeloNXMoltenVKBuildVersion="$MVK_PACKAGE_VERSION" \
            INFOPLIST_KEY_MeloNXMoltenVKSHA256="$MVK_FINAL_SHA256" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            -showBuildSettings \
            2>&1 | tee "$ARTIFACT_DIR/failure/build-settings.txt"

      - name: Build iOS device app
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            PRODUCT_BUNDLE_IDENTIFIER="$TEST_BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$TEST_DISPLAY_NAME" \
            INFOPLIST_KEY_MeloNXBuildVariant="$TEST_VARIANT" \
            INFOPLIST_KEY_MeloNXGitCommit="$GITHUB_SHA" \
            INFOPLIST_KEY_MeloNXMoltenVKBuildVersion="$MVK_PACKAGE_VERSION" \
            INFOPLIST_KEY_MeloNXMoltenVKSHA256="$MVK_FINAL_SHA256" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build \
            2>&1 | tee -a "$ARTIFACT_DIR/failure/xcodebuild.log"

      - name: Locate the unambiguous Release-iphoneos app
        shell: bash
        run: |
          set -euo pipefail
          app_candidates=()
          while IFS= read -r candidate; do
            app_candidates+=("$candidate")
          done < <(
            find "$DERIVED_DATA_PATH/Build/Products" \
              -type d \
              -name 'MeloNX.app' \
              -path '*Release-iphoneos*' \
              -print \
              | sort
          )
          printf 'Release-iphoneos MeloNX.app candidates:\n'
          printf '  %s\n' "${app_candidates[@]:-<none>}"
          if [[ "${#app_candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one app candidate." >&2
            exit 1
          fi
          app_path="${app_candidates[0]}"
          [[ "$app_path" == "$DERIVED_DATA_PATH"/* ]] || {
            echo "App candidate is outside short DerivedData: $app_path" >&2
            exit 1
          }
          echo "BUILT_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Ad-hoc sign and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          entitlements="$ARTIFACT_DIR/final/signing-entitlements.plist"
          package_root="$STAGE_PATH/package"
          ipa="$ARTIFACT_DIR/final/MeloNX-MVK-Test-unsigned.ipa"

          cp \
            "$SOURCE_ROOT/src/MeloNX/MeloNX/MeloNX.entitlements" \
            "$entitlements"
          plutil -lint "$entitlements"

          if [[ -d "$BUILT_APP_PATH/Frameworks" ]]; then
            while IFS= read -r -d '' item; do
              codesign --force --sign - --timestamp=none "$item"
            done < <(
              find "$BUILT_APP_PATH/Frameworks" -depth \
                \( -type d -name '*.framework' -o -type f -name '*.dylib' \) \
                -print0
            )
          fi
          codesign \
            --force \
            --sign - \
            --entitlements "$entitlements" \
            --timestamp=none \
            "$BUILT_APP_PATH"
          codesign --verify --deep --strict "$BUILT_APP_PATH"

          rm -rf "$package_root"
          mkdir -p "$package_root/Payload"
          cp -R "$BUILT_APP_PATH" "$package_root/Payload/MeloNX.app"
          (cd "$package_root" && zip -qry "$ipa" Payload)
          [[ -s "$ipa" ]]

      - name: Strictly verify the final IPA and reports
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "FINAL IPA VALIDATION ERROR: $*" >&2
            exit 1
          }

          version_le() {
            python3 - "$1" "$2" <<'PY'
          import sys
          left = tuple(int(part) for part in sys.argv[1].split("."))
          right = tuple(int(part) for part in sys.argv[2].split("."))
          width = max(len(left), len(right))
          left += (0,) * (width - len(left))
          right += (0,) * (width - len(right))
          raise SystemExit(0 if left <= right else 1)
          PY
          }

          ipa="$ARTIFACT_DIR/final/MeloNX-MVK-Test-unsigned.ipa"
          rm -rf "$VERIFY_PATH"
          mkdir -p "$VERIFY_PATH"
          unzip -q "$ipa" -d "$VERIFY_PATH"

          app="$VERIFY_PATH/Payload/MeloNX.app"
          [[ -d "$app" ]] || fail "Payload/MeloNX.app is missing"
          app_count="$(find "$VERIFY_PATH/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$app_count" == "1" ]] || fail "Payload must contain exactly one app"

          info="$app/Info.plist"
          [[ -f "$info" ]] || fail "Info.plist is missing"
          plutil -lint "$info"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")"
          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")"
          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$info")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")"
          display_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")"
          [[ "$bundle_id" == "$TEST_BUNDLE_ID" ]] || fail "Bundle ID is $bundle_id"
          [[ "$display_name" == "$TEST_DISPLAY_NAME" ]] || fail "Display Name is $display_name"
          [[ "$minimum_os" == "$IOS_DEPLOYMENT_TARGET" ]] \
            || fail "MinimumOSVersion is $minimum_os, expected $IOS_DEPLOYMENT_TARGET"

          main_binary="$app/$executable"
          [[ -f "$main_binary" ]] || fail "main executable is missing"
          [[ "$(lipo -archs "$main_binary")" == "arm64" ]] \
            || fail "main executable is not arm64-only"
          main_build="$(vtool -show-build "$main_binary")"
          grep -Eq \
            'platform[[:space:]]+IOS[[:space:]]*$|LC_VERSION_MIN_IPHONEOS' \
            <<< "$main_build" \
            || fail "main executable is not iOS device Mach-O"
          ! grep -Eq \
            'platform[[:space:]]+(IOSSIMULATOR|MACOS|MACCATALYST)[[:space:]]*$|LC_VERSION_MIN_(IPHONESIMULATOR|MACOSX)' \
            <<< "$main_build" \
            || fail "main executable targets Simulator, macOS, or Mac Catalyst"

          main_rpaths="$(otool -l "$main_binary" | awk '/cmd LC_RPATH/{getline; getline; print $2}')"
          grep -Fxq '@executable_path/Frameworks' <<< "$main_rpaths" \
            || fail "main executable lacks @executable_path/Frameworks rpath"

          mvk_count="$(find "$app" -type f -name 'libMoltenVK.dylib' | wc -l | tr -d ' ')"
          [[ "$mvk_count" == "1" ]] || fail "expected one MoltenVK; found $mvk_count"
          mvk_path="$(find "$app" -type f -name 'libMoltenVK.dylib' -print -quit)"
          mvk_sha="$(shasum -a 256 "$mvk_path" | awk '{print $1}')"
          [[ "$mvk_sha" == "$MVK_FINAL_SHA256" ]] \
            || fail "embedded MoltenVK SHA-256 changed"
          [[ "$mvk_sha" != "$OLD_MVK_140_SHA256" ]] \
            || fail "old MoltenVK 1.4.0 remains"
          [[ "$(lipo -archs "$mvk_path")" == "arm64" ]] \
            || fail "MoltenVK is not arm64-only"
          [[ "$(otool -D "$mvk_path" | sed -n '2p')" == '@rpath/libMoltenVK.dylib' ]] \
            || fail "MoltenVK install name is incorrect"

          ryujinx_library="$(find "$app" -type f -name 'Ryujinx.Library.dylib' -print -quit)"
          [[ -n "$ryujinx_library" ]] || fail "Ryujinx.Library.dylib is missing"
          [[ "$(otool -D "$ryujinx_library" | sed -n '2p')" == '@rpath/Ryujinx.Library.dylib' ]] \
            || fail "Ryujinx.Library install name is incorrect"
          otool -L "$ryujinx_library" \
            | awk '{print $1}' \
            | grep -Fxq '@rpath/libMoltenVK.dylib' \
            || fail "Ryujinx.Library does not link @rpath/libMoltenVK.dylib"

          macho_report="$STAGE_PATH/macho-report.txt"
          : > "$macho_report"
          while IFS= read -r -d '' binary; do
            description="$(file -b "$binary")"
            [[ "$description" == *Mach-O* ]] || continue
            archs="$(lipo -archs "$binary")"
            [[ "$archs" == "arm64" ]] \
              || fail "non-arm64 Mach-O: $binary ($archs)"
            build_info="$(vtool -show-build "$binary")"
            grep -Eq \
              'platform[[:space:]]+IOS[[:space:]]*$|LC_VERSION_MIN_IPHONEOS' \
              <<< "$build_info" \
              || fail "non-iOS-device Mach-O: $binary"
            ! grep -Eq \
              'platform[[:space:]]+(IOSSIMULATOR|MACOS|MACCATALYST)[[:space:]]*$|LC_VERSION_MIN_(IPHONESIMULATOR|MACOSX)' \
              <<< "$build_info" \
              || fail "Simulator/macOS/Mac Catalyst Mach-O: $binary"
            binary_minos="$(awk '$1 == "minos" { value=$2 } $1 == "version" && value == "" { value=$2 } END { print value }' <<< "$build_info")"
            [[ -n "$binary_minos" ]] || fail "minimum OS is missing: $binary"
            version_le "$binary_minos" "$IOS_DEPLOYMENT_TARGET" \
              || fail "minimum OS exceeds target: $binary ($binary_minos)"

            while IFS= read -r dependency; do
              case "$dependency" in
                @rpath/*|@loader_path/*|@executable_path/*|/usr/lib/*|/System/Library/*) ;;
                *) fail "unexpected absolute dependency in $binary: $dependency" ;;
              esac
            done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')

            {
              echo "FILE: ${binary#$VERIFY_PATH/}"
              echo "TYPE: $description"
              echo "ARCHS: $archs"
              echo "MINIMUM_OS: $binary_minos"
              otool -D "$binary" || true
              otool -L "$binary"
              echo "RPATHS:"
              otool -l "$binary" | awk '/cmd LC_RPATH/{getline; getline; print $2}'
              echo
            } >> "$macho_report"
          done < <(find "$app" -type f -print0)

          effective_entitlements="$STAGE_PATH/effective-entitlements.plist"
          codesign -d --entitlements :- "$app" \
            > "$effective_entitlements" \
            2> "$STAGE_PATH/codesign.txt"
          plutil -lint "$effective_entitlements"
          for key in \
            com.apple.developer.cs.allow-jit \
            com.apple.developer.kernel.increased-memory-limit \
            com.apple.developer.kernel.extended-virtual-addressing; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$effective_entitlements")"
            [[ "$value" == "true" ]] \
              || fail "required entitlement is missing or false: $key"
          done

          sensitive_count="$(find "$app" -type f \
            \( -iname 'prod.keys' -o -iname 'title.keys' -o -iname '*.nsp' \
               -o -iname '*.xci' -o -iname '*.nca' -o -iname '*.nsz' \
               -o -iname '*.rom' -o -iname '*firmware*.zip' \) \
            | wc -l | tr -d ' ')"
          [[ "$sensitive_count" == "0" ]] \
            || fail "keys, game content, or firmware was packaged"

          ipa_sha="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          entitlements_sha="$(shasum -a 256 "$ARTIFACT_DIR/final/signing-entitlements.plist" | awk '{print $1}')"
          {
            echo "$ipa_sha  MeloNX-MVK-Test-unsigned.ipa"
            echo "$mvk_sha  Payload/MeloNX.app/Frameworks/libMoltenVK.dylib"
            echo "$entitlements_sha  signing-entitlements.plist"
          } > "$ARTIFACT_DIR/final/sha256.txt"

          {
            echo "SOURCE=official MeloNX 2.5 archive"
            echo "SOURCE_SHA256=$SOURCE_ARCHIVE_SHA256"
            echo "SOURCE_URL=$SOURCE_ARCHIVE_URL"
            echo "STATIC_VALIDATION=PASSED"
            echo "RUNNER=macos-26-intel"
            echo "XCODE=$(xcodebuild -version | tr '\n' ' ')"
            echo "IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH"
            echo "LOCATED_APP=$BUILT_APP_PATH"
            echo "DISPLAY_VERSION=$display_version"
            echo "BUNDLE_ID=$bundle_id"
            echo "DISPLAY_NAME=$display_name"
            echo "MINIMUM_OS_VERSION=$minimum_os"
            echo "MAIN_ARCHITECTURE=$(lipo -archs "$main_binary")"
            echo "MOLTENVK_PACKAGE=$MVK_PACKAGE_ID $MVK_PACKAGE_VERSION"
            echo "MOLTENVK_COPIES=$mvk_count"
            echo "MOLTENVK_SHA256=$mvk_sha"
            echo "MOLTENVK_INSTALL_NAME=$(otool -D "$mvk_path" | sed -n '2p')"
            echo "MAIN_RPATH=@executable_path/Frameworks"
            echo "ENTITLEMENTS=allow-jit,increased-memory-limit,extended-virtual-addressing"
            echo "IPA_SHA256=$ipa_sha"
            echo "NO_GAME_KEY_OR_FIRMWARE_CONTENT=YES"
            echo "LINEAR_MSAA_LOGIC_CHANGED=NO"
          } > "$ARTIFACT_DIR/final/build-report.txt"

          cat "$macho_report" >> "$ARTIFACT_DIR/failure/dependency-report.txt"
          cp \
            "$ARTIFACT_DIR/failure/dependency-report.txt" \
            "$ARTIFACT_DIR/final/dependency-report.txt"
          cp \
            "$ARTIFACT_DIR/failure/environment.txt" \
            "$ARTIFACT_DIR/final/environment.txt"

          final_names="$(find "$ARTIFACT_DIR/final" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort)"
          expected_names="$(printf '%s\n' \
            MeloNX-MVK-Test-unsigned.ipa \
            build-report.txt \
            dependency-report.txt \
            environment.txt \
            sha256.txt \
            signing-entitlements.plist \
            | sort)"
          [[ "$final_names" == "$expected_names" ]] \
            || fail "FINAL artifact file set is not exact"

      - name: Upload successful FINAL artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-MVK-Test-FINAL
          path: ${{ runner.temp }}/mxartifacts/final/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "MeloNX empty-repository bootstrap workflow failed"
            echo "SOURCE=official MeloNX 2.5 archive"
            echo "SOURCE_URL=$SOURCE_ARCHIVE_URL"
            echo "SOURCE_SHA256=$SOURCE_ARCHIVE_SHA256"
            echo "RUNNER=macos-26-intel"
            echo "RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "No mirror or checked-out repository source fallback was attempted."
            echo "Inspect dependency-report.txt for source/download/patch diagnostics."
            echo "Inspect build-settings.txt and xcodebuild.log for build diagnostics."
            echo
            grep -nEm 40 \
              'SOURCE (EXTRACT|PATCH) ERROR|SHA-256 mismatch|FINAL IPA VALIDATION ERROR|fatal error:|error:|ld: |clang: error:|BUILD FAILED|command failed with exit code' \
              "$ARTIFACT_DIR/failure/dependency-report.txt" \
              "$ARTIFACT_DIR/failure/build-settings.txt" \
              "$ARTIFACT_DIR/failure/xcodebuild.log" \
              2>/dev/null || true
          } > "$ARTIFACT_DIR/failure/failure-summary.txt"

      - name: Upload FAILURE artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-MVK-Test-FAILURE
          path: ${{ runner.temp }}/mxartifacts/failure/
          if-no-files-found: error
          retention-days: 14
